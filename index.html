<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>人生只有900个月</title>
  <meta name="description" content="用 30 x 30 的月份方格，看见自己和重要的人生时间。">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="900个月">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app-icon-512.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
</head>
<body>
  <div class="header">
    <button class="sidebar-btn" id="sidebarBtn"><i class="fa fa-bars"></i></button>
    <button class="avatar-btn" id="avatarBtn"><i class="fa fa-user-circle"></i></button>
  </div>
  <div class="main">
    <div class="months-grid" id="monthsGrid"></div>
    <div class="footer" id="footerText"></div>
    <div class="cell-float-card" id="cellFloatCard" hidden></div>
  </div>

  <!-- 生日输入弹窗 -->
  <div class="modal-bg" id="birthdayModal" hidden>
    <div class="modal">
      <button class="close-btn" onclick="closeBirthdayModal()"><i class="fa fa-times"></i></button>
      <h2>人生只有900个月</h2>
      <p>每个人的一生大约只有900个月。<br>请选择你的出生年月，看看你还剩下多少个月。</p>
      <div class="month-picker" id="customMonthPicker">
        <select id="yearPicker"></select>
        <span class="month-picker-label">年</span>
        <select id="monthPicker"></select>
        <span class="month-picker-label">月</span>
      </div>
      <div class="modal-actions">
        <button onclick="saveBirthday()">确定</button>
      </div>
    </div>
  </div>

  <!-- 格子详情弹窗 -->
  <div class="modal-bg" id="cellDetailModal" hidden>
    <div class="modal" id="cellDetailContent">
      <!-- 动态填充 -->
    </div>
  </div>

  <!-- 成员头像裁切弹窗 -->
  <div class="modal-bg" id="avatarCropModal" hidden>
    <div class="modal avatar-crop-modal">
      <button class="close-btn" id="avatarCropClose" type="button"><i class="fa fa-times"></i></button>
      <h2>调整头像</h2>
      <div class="avatar-crop-stage">
        <canvas id="avatarCropCanvas" width="280" height="280"></canvas>
        <div class="avatar-crop-frame"></div>
      </div>
      <label class="avatar-zoom-label" for="avatarZoom">缩放</label>
      <input class="avatar-zoom" id="avatarZoom" type="range" min="1" max="3" step="0.01" value="1">
      <div class="modal-actions">
        <button class="secondary-button" id="avatarCropCancel" type="button">取消</button>
        <button id="avatarCropApply" type="button">使用头像</button>
      </div>
    </div>
  </div>

  <!-- 侧边栏 -->
  <div class="sidebar-bg" id="sidebarBg" hidden></div>
  <div class="sidebar" id="sidebar" hidden>
    <h3>配置</h3>
    <div class="section entry-section">
      <button class="entry-button" id="openMemberManager" type="button">
        <span>编辑人生成员</span>
        <small>人生重要成员的人生进程叠加到您的人生进程视图</small>
      </button>
      <button class="entry-button" id="openEventManager" type="button">
        <span>编辑人生重要月份节点</span>
        <small>本人重要的月份节点，叠加显示在您的人生进程</small>
      </button>
    </div>
    <button class="close-sidebar-button" onclick="closeSidebar()">关闭</button>
  </div>

  <!-- 成员管理面板 -->
  <div class="manager-bg" id="memberManagerBg" hidden>
    <div class="manager-sheet">
      <div class="manager-header">
        <button class="manager-close" id="closeMemberManager" type="button"><i class="fa fa-times"></i></button>
        <h2>人生成员</h2>
        <button class="manager-add" id="showMemberForm" type="button"><i class="fa fa-plus"></i></button>
      </div>
      <div class="manager-list" id="memberList"></div>
      <form class="manager-form" id="addMemberForm" hidden>
        <input class="member-title-input" type="text" id="memberTitle" placeholder="成员名称" required>
        <div class="form-row">
          <span class="form-label">生日</span>
          <select id="memberYearPicker"></select>
          <span class="form-label">年</span>
          <select id="memberMonthPicker"></select>
          <span class="form-label">月</span>
        </div>
        <label>头像</label>
        <div class="avatar-upload-row">
          <input class="image-input" type="file" id="memberImg" accept="image/*">
          <div class="avatar-preview" id="memberAvatarPreview" hidden></div>
        </div>
        <div class="manager-form-actions">
          <button class="danger-text-button" id="deleteMemberForm" type="button" hidden>删除</button>
          <button class="secondary-button" id="cancelMemberForm" type="button">取消</button>
          <button class="submit-button" id="submitMemberForm" type="submit">添加成员</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 重要月份管理面板 -->
  <div class="manager-bg" id="eventManagerBg" hidden>
    <div class="manager-sheet">
      <div class="manager-header">
        <button class="manager-close" id="closeEventManager" type="button"><i class="fa fa-times"></i></button>
        <h2>重要月份</h2>
        <button class="manager-add" id="showEventForm" type="button"><i class="fa fa-plus"></i></button>
      </div>
      <div class="manager-list" id="eventList"></div>
      <form class="manager-form" id="addEventForm" hidden>
        <label>名称</label>
        <input type="text" id="eventName" placeholder="如：高考、结婚..." required>
        <div class="form-row">
          <span class="form-label">月份</span>
          <select id="eventYearPicker"></select>
          <span class="form-label">年</span>
          <select id="eventMonthPicker"></select>
          <span class="form-label">月</span>
        </div>
        <label>图标/照片</label>
        <div class="emoji-input-row">
          <input class="emoji-input" type="text" id="eventEmoji" maxlength="2" placeholder="🎉">
          <button class="emoji-button" type="button" id="eventEmojiBtn">🎉</button>
          <emoji-picker class="emoji-picker-popover" id="eventEmojiPicker" hidden></emoji-picker>
          <input class="image-input" type="file" id="eventImg" accept="image/*">
        </div>
        <div class="manager-form-actions">
          <button class="danger-text-button" id="deleteEventForm" type="button" hidden>删除</button>
          <button class="secondary-button" id="cancelEventForm" type="button">取消</button>
          <button class="submit-button" id="submitEventForm" type="submit">添加重要月份</button>
        </div>
      </form>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
